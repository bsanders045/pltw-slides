name: Refresh Presentation Images

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-slides:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository Content
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Slide Rotator Script
        run: python rotate_images.py

      - name: Commit and Push Image Changes
        run: |
          git config --global user.name "Engineering-Bot"
          git config --global user.email "engineering-bot@users.noreply.github.com"
          git add pltw_civil_architecture.html
          git diff-index --quiet HEAD || git commit -m "Automated Slide Refreshes [skip ci]"
          git push
