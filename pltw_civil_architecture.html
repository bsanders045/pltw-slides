<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLTW Civil Engineering & Architecture</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 40px; }
        .slide { max-width: 1100px; margin: 0 auto 50px; background-color: #0f172a; border-radius: 16px; border: 1px solid rgba(249, 115, 22, 0.2); overflow: hidden; height: 500px; display: grid; grid-template-columns: 1fr 1fr; }
        .text { padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        .text h2 { margin: 0 0 10px; color: #f97316; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; }
        .text p { color: #94a3b8; font-size: 16px; line-height: 1.6; }
        .img-container { height: 100%; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <h1 style="text-align:center; font-family: 'Plus Jakarta Sans', sans-serif; color: white;">PLTW Civil Engineering & Architecture</h1>
    <div class="slide" id="slide2">
        <div class="text">
            <h2>Art Deco Heights</h2>
            <p>Emerging in the 1920s, Art Deco combined luxurious design with modern industrial technology. It features bold geometric shapes and metallic highlights.</p>
        </div>
        <div class="img-container">
            <img id="img-slide2" src="https://images.unsplash.com/photo-1546412414-8035e1776c9a?auto=format&fit=crop&w=1200&q=80">
        </div>
    </div>
    <!-- Additional slide blocks correspond exactly to rotation keys -->
</body>
</html>
